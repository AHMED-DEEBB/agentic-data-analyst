# Tool: Docker Compose. What: runs several containers together (database + API) from one file.
# Why: the whole system starts with a single command: docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: analyst_admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: analyst
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst_admin -d analyst"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://analyst_admin:admin@db:5432/analyst
      READONLY_DATABASE_URL: postgresql://analyst_ro:readonly@db:5432/analyst
    ports:
      - "8000:8000"
    volumes:
      - ./evals/results:/app/evals/results
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
