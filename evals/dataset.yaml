# Evaluation set. Two kinds of cases:
#   expect: answer  -> the agent's result must match the result of gold_sql (execution accuracy)
#   expect: refuse  -> the agent must refuse (out of scope or unsafe)
# R = revenue expression from the business glossary.

cases:
  # ---------------- English ----------------
  - id: en01
    lang: en
    question: What was total revenue in 2025?
    gold_sql: SELECT ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025

  - id: en02
    lang: en
    question: Total sales in 2024?
    gold_sql: SELECT ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2024

  - id: en03
    lang: en
    question: Show revenue by country for 2025
    gold_sql: SELECT s.country, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN stores s USING(store_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY 1

  - id: en04
    lang: en
    question: How many orders did we complete in 2024?
    gold_sql: SELECT COUNT(*) FROM orders WHERE status='Completed' AND EXTRACT(YEAR FROM order_date)=2024

  - id: en05
    lang: en
    question: What are the top 5 products by revenue?
    gold_sql: SELECT p.name, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) r FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' GROUP BY p.product_id, p.name ORDER BY r DESC LIMIT 5

  - id: en06
    lang: en
    question: Revenue by product category in 2025
    gold_sql: SELECT p.category, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY 1

  - id: en07
    lang: en
    question: Monthly revenue trend for 2025
    gold_sql: SELECT date_trunc('month',o.order_date)::date, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY 1

  - id: en08
    lang: en
    question: Which store generated the most revenue in 2024?
    gold_sql: SELECT s.name FROM order_items oi JOIN orders o USING(order_id) JOIN stores s USING(store_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2024 GROUP BY s.store_id, s.name ORDER BY SUM(oi.quantity*oi.unit_price*(1-oi.discount)) DESC LIMIT 1

  - id: en09
    lang: en
    question: What was the average order value in 2025?
    gold_sql: SELECT ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount))/COUNT(DISTINCT o.order_id),2) FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025

  - id: en10
    lang: en
    question: What is the cancellation rate by channel?
    gold_sql: SELECT channel, ROUND(100.0*COUNT(*) FILTER (WHERE status='Cancelled')/COUNT(*),2) FROM orders GROUP BY 1

  - id: en11
    lang: en
    question: What percentage of 2025 revenue came from online orders?
    gold_sql: SELECT ROUND(100.0*SUM(oi.quantity*oi.unit_price*(1-oi.discount)) FILTER (WHERE o.channel='Online')/SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025

  - id: en12
    lang: en
    question: Units sold by category
    gold_sql: SELECT p.category, SUM(oi.quantity) FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' GROUP BY 1

  - id: en13
    lang: en
    question: How many business customers do we have?
    gold_sql: SELECT COUNT(*) FROM customers WHERE segment='Business'

  - id: en14
    lang: en
    question: Which 3 store cities had the most completed orders in 2025?
    gold_sql: SELECT s.city FROM orders o JOIN stores s USING(store_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY s.city ORDER BY COUNT(*) DESC LIMIT 3

  - id: en15
    lang: en
    question: Gross profit by category in 2024
    gold_sql: SELECT p.category, ROUND(SUM(oi.quantity*(oi.unit_price*(1-oi.discount)-p.unit_cost)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2024 GROUP BY 1

  - id: en16
    lang: en
    question: What was our gross margin percentage in 2025?
    gold_sql: SELECT ROUND(100*SUM(oi.quantity*(oi.unit_price*(1-oi.discount)-p.unit_cost))/SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025

  - id: en17
    lang: en
    question: Number of returned orders by country
    gold_sql: SELECT s.country, COUNT(*) FROM orders o JOIN stores s USING(store_id) WHERE o.status='Returned' GROUP BY 1

  - id: en18
    lang: en
    question: Revenue by year and channel
    gold_sql: SELECT EXTRACT(YEAR FROM o.order_date)::int, o.channel, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed' GROUP BY 1,2

  - id: en19
    lang: en
    question: Top 5 customers by revenue, with their customer ID
    gold_sql: SELECT c.customer_id, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) r FROM order_items oi JOIN orders o USING(order_id) JOIN customers c USING(customer_id) WHERE o.status='Completed' GROUP BY c.customer_id ORDER BY r DESC LIMIT 5

  - id: en20
    lang: en
    question: Revenue per store in Q1 2025
    gold_sql: SELECT s.name, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN stores s USING(store_id) WHERE o.status='Completed' AND o.order_date >= '2025-01-01' AND o.order_date < '2025-04-01' GROUP BY s.store_id, s.name

  - id: en21
    lang: en
    question: Which category has the highest average list price?
    gold_sql: SELECT category FROM products GROUP BY category ORDER BY AVG(unit_price) DESC LIMIT 1

  - id: en22
    lang: en
    question: How many products are in each category?
    gold_sql: SELECT category, COUNT(*) FROM products GROUP BY 1

  - id: en23
    lang: en
    question: By what percentage did revenue grow in 2025 compared to 2024?
    gold_sql: WITH y AS (SELECT SUM(oi.quantity*oi.unit_price*(1-oi.discount)) FILTER (WHERE EXTRACT(YEAR FROM o.order_date)=2025) r25, SUM(oi.quantity*oi.unit_price*(1-oi.discount)) FILTER (WHERE EXTRACT(YEAR FROM o.order_date)=2024) r24 FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed') SELECT ROUND(100*(r25-r24)/r24,2) FROM y

  - id: en24
    lang: en
    question: How many active customers did we have in 2025?
    gold_sql: SELECT COUNT(DISTINCT customer_id) FROM orders WHERE status='Completed' AND EXTRACT(YEAR FROM order_date)=2025

  - id: en25
    lang: en
    question: What was the best-selling product by units in 2025?
    gold_sql: SELECT p.name FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY p.product_id, p.name ORDER BY SUM(oi.quantity) DESC LIMIT 1

  - id: en26
    lang: en
    question: How much revenue came from business customers in 2025?
    gold_sql: SELECT ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN customers c USING(customer_id) WHERE o.status='Completed' AND c.segment='Business' AND EXTRACT(YEAR FROM o.order_date)=2025

  - id: en27
    lang: en
    question: How many completed orders were placed in November 2025?
    gold_sql: SELECT COUNT(*) FROM orders WHERE status='Completed' AND order_date >= '2025-11-01' AND order_date < '2025-12-01'

  - id: en28
    lang: en
    question: How many stores do we have in each country?
    gold_sql: SELECT country, COUNT(*) FROM stores GROUP BY 1

  - id: en29
    lang: en
    question: Average order value by channel in 2025
    gold_sql: SELECT o.channel, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount))/COUNT(DISTINCT o.order_id),2) FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY 1

  - id: en30
    lang: en
    question: Revenue by customer segment in 2024
    gold_sql: SELECT c.segment, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN customers c USING(customer_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2024 GROUP BY 1

