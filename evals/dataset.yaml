  - id: ar07
    lang: ar
    question: ما هو متوسط قيمة الطلب في 2024؟
    gold_sql: SELECT ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount))/COUNT(DISTINCT o.order_id),2) FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2024

  - id: ar08
    lang: ar
    question: ما هي الإيرادات حسب مدينة الفرع في 2025؟
    gold_sql: SELECT s.city, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN stores s USING(store_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY 1

  - id: ar09
    lang: ar
