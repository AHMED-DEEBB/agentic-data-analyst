    question: ما هي الإيرادات حسب الفئة في 2024؟
    gold_sql: SELECT p.category, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2024 GROUP BY 1

  - id: ar03
    lang: ar
    question: كم عدد الطلبات المكتملة في عام 2025؟
    gold_sql: SELECT COUNT(*) FROM orders WHERE status='Completed' AND EXTRACT(YEAR FROM order_date)=2025

  - id: ar04
    lang: ar
    question: ما هي أفضل 5 منتجات من حيث الإيرادات في 2025؟
    gold_sql: SELECT p.name, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) r FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY p.product_id, p.name ORDER BY r DESC LIMIT 5

  - id: ar05
