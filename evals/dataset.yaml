  - id: ar10
    lang: ar
    question: ما هو إجمالي الربح في 2025؟
    gold_sql: SELECT ROUND(SUM(oi.quantity*(oi.unit_price*(1-oi.discount)-p.unit_cost)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025

  - id: ar11
    lang: ar
    question: ما هي إيرادات كل فرع في الإمارات خلال 2025؟
    gold_sql: SELECT s.name, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) JOIN stores s USING(store_id) WHERE o.status='Completed' AND s.country='UAE' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY s.store_id, s.name

  - id: ar12
