    question: كم عدد الوحدات المباعة من فئة الإلكترونيات في 2025؟
    gold_sql: SELECT SUM(oi.quantity) FROM order_items oi JOIN orders o USING(order_id) JOIN products p USING(product_id) WHERE o.status='Completed' AND p.category='Electronics' AND EXTRACT(YEAR FROM o.order_date)=2025

  - id: ar13
    lang: ar
    question: ما هي نسبة الطلبات المرتجعة من إجمالي الطلبات؟
    gold_sql: SELECT ROUND(100.0*COUNT(*) FILTER (WHERE status='Returned')/COUNT(*),2) FROM orders

  - id: ar14
    lang: ar
    question: قارن إيرادات الأونلاين والفروع في 2025
    gold_sql: SELECT o.channel, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) FROM order_items oi JOIN orders o USING(order_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2025 GROUP BY 1

  - id: ar15
    lang: ar
    question: من هم أفضل 3 عملاء من حيث الإيرادات في 2024 مع رقم العميل؟
    gold_sql: SELECT c.customer_id, ROUND(SUM(oi.quantity*oi.unit_price*(1-oi.discount)),2) r FROM order_items oi JOIN orders o USING(order_id) JOIN customers c USING(customer_id) WHERE o.status='Completed' AND EXTRACT(YEAR FROM o.order_date)=2024 GROUP BY c.customer_id ORDER BY r DESC LIMIT 3

